name: Build StudyFlow APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test scheduling invariants
        run: |
          mkdir -p /tmp/studyflow-tests
          javac -d /tmp/studyflow-tests app/src/main/java/app/studyflow/Planner.java tests/PlannerTest.java
          java -cp /tmp/studyflow-tests app.studyflow.PlannerTest
      - name: Test offline document reader
        run: |
          javac -d /tmp/studyflow-tests app/src/main/java/app/studyflow/DocumentText.java tests/DocumentTextTest.java
          java -cp /tmp/studyflow-tests app.studyflow.DocumentTextTest
      - name: Test accent contrast
        run: |
          javac -d /tmp/studyflow-tests app/src/main/java/app/studyflow/ThemeColors.java tests/ThemeColorsTest.java
          java -cp /tmp/studyflow-tests app.studyflow.ThemeColorsTest
      - name: Test study tools
        run: |
          javac -d /tmp/studyflow-tests app/src/main/java/app/studyflow/StudyTools.java tests/StudyToolsTest.java
          java -cp /tmp/studyflow-tests app.studyflow.StudyToolsTest
      - name: Test visual Office preview
        run: |
          javac -d /tmp/studyflow-tests app/src/main/java/app/studyflow/DocumentText.java app/src/main/java/app/studyflow/OfficePreview.java tests/OfficePreviewTest.java
          java -cp /tmp/studyflow-tests app.studyflow.OfficePreviewTest
      - name: Test navigation history
        run: |
          javac -d /tmp/studyflow-tests app/src/main/java/app/studyflow/NavigationTrail.java tests/NavigationTrailTest.java
          java -cp /tmp/studyflow-tests app.studyflow.NavigationTrailTest
      - name: Build and lint
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
      - name: Verify original icon bytes in APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_STORED
          source = Path('app/src/main/res/drawable-nodpi/studyflow_icon.jpg').read_bytes()
          with ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              entries = [e for e in apk.infolist() if e.filename.endswith('/studyflow_icon.jpg')]
              assert len(entries) == 1, 'Launcher image missing or duplicated'
              assert apk.read(entries[0]) == source, 'Launcher image bytes changed'
              assert entries[0].compress_type == ZIP_STORED, 'Launcher image was compressed'
          print('Original full-resolution icon stored byte-for-byte without ZIP compression')
          PY
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android UI smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w app.studyflow.test/app.studyflow.UiChecks | tee /tmp/studyflow-ui-result.txt
            grep -q STUDYFLOW_UI_OK /tmp/studyflow-ui-result.txt
            adb pull /sdcard/Android/data/app.studyflow/files/ui-checks app/build/ui-checks
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-UI-checks
          path: app/build/ui-checks
          if-no-files-found: ignore
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-0.7.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
  signed-release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STUDYFLOW_KEYSTORE_PATH: ${{ github.workspace }}/../studyflow-release.p12
      STUDYFLOW_KEYSTORE_PASSWORD: ${{ secrets.STUDYFLOW_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore permanent key and verify identity
        env:
          KEYSTORE_BASE64: ${{ secrets.STUDYFLOW_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STUDYFLOW_KEYSTORE_PASSWORD" || { echo 'Set the two repository secrets described in SIGNING.md.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$STUDYFLOW_KEYSTORE_PATH"
          keytool -exportcert -alias studyflow-release -keystore "$STUDYFLOW_KEYSTORE_PATH" -storepass:env STUDYFLOW_KEYSTORE_PASSWORD > "$RUNNER_TEMP/release.der"
          ACTUAL=$(sha256sum "$RUNNER_TEMP/release.der" | cut -d ' ' -f1)
          EXPECTED=$(tr -d '\r\n' < signing/release-sha256.txt)
          test "$ACTUAL" = "$EXPECTED" || { echo 'Signing certificate mismatch. Refusing to change app identity.'; exit 1; }
      - name: Build signed release
        run: gradle --no-daemon assembleRelease lintRelease
      - name: Verify APK signature
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          "$SIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -F "$(cat signing/release-sha256.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-0.7.1-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove private signing material
        if: always()
        run: rm -f "$STUDYFLOW_KEYSTORE_PATH" "$RUNNER_TEMP/release.der"
