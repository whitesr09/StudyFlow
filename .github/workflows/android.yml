name: Build StudyFlow APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test scheduling invariants
        run: |
          mkdir -p /tmp/studyflow-tests
          javac -d /tmp/studyflow-tests app/src/main/java/app/studyflow/Planner.java tests/PlannerTest.java
          java -cp /tmp/studyflow-tests app.studyflow.PlannerTest
      - name: Test offline document reader
        run: |
          javac -d /tmp/studyflow-tests app/src/main/java/app/studyflow/DocumentText.java tests/DocumentTextTest.java
          java -cp /tmp/studyflow-tests app.studyflow.DocumentTextTest
      - name: Test accent contrast
        run: |
          javac -d /tmp/studyflow-tests app/src/main/java/app/studyflow/ThemeColors.java tests/ThemeColorsTest.java
          java -cp /tmp/studyflow-tests app.studyflow.ThemeColorsTest
      - name: Test study tools
        run: |
          javac -d /tmp/studyflow-tests app/src/main/java/app/studyflow/StudyTools.java tests/StudyToolsTest.java
          java -cp /tmp/studyflow-tests app.studyflow.StudyToolsTest
      - name: Build and lint
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-0.4.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
